.small{text-align:center;color:#cbd5e1;font-size:14px;line-height:1.5}

.card p{font-size:16px}

<body>

<div class="language">
<select id="language" onchange="cambiarIdiomaPantalla()" aria-label="Idioma">

<section class="card" id="informationCard">

<section class="card">
<div class="price">$15.99 / mes</div>

function t(key){
return (T[idiomaActual]&&T[idiomaActual][key])||T.es[key]||key;
}

function getDeviceId(){
let id=localStorage.getItem(DEVICE_KEY);
if(!id){
id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"alcielo-"+Date.now()+"-"+Math.random().toString(36).slice(2);
localStorage.setItem(DEVICE_KEY,id);
}
dispositivo=id;
return id;
}

function cargarIdioma(){
const guardado=localStorage.getItem(LANGUAGE_KEY);
idiomaActual=(guardado==="en"||guardado==="pt"||guardado==="es")?guardado:"es";
document.getElementById("language").value=idiomaActual;
aplicarIdioma();
}

function cambiarIdiomaPantalla(){
const nuevo=document.getElementById("language").value;
if(nuevo!=="es"&&nuevo!=="en"&&nuevo!=="pt")return;
detenerMusicaRelajacion();
idiomaActual=nuevo;
localStorage.setItem(LANGUAGE_KEY,idiomaActual);
window.speechSynthesis.cancel();
vozActiva=false;
vozCancelada=true;
parrafosVoz=[];
indiceVoz=0;
aplicarIdioma();
}

function aplicarIdioma(){
document.documentElement.lang=idiomaActual;
document.getElementById("language").value=idiomaActual;
const mapa={
subtitle:"subtitle",
infoTitle:"infoTitle",
infoText:"infoText",
phase1Title:"phase1Title",
phase1:"phase1",
phase2Title:"phase2Title",
phase2:"phase2",
phase3Title:"phase3Title",
phase3:"phase3",
serviceTitle:"serviceTitle",
serviceText:"serviceText",
sample:"sampleBtn",
full:"fullBtn",
voice:"voiceBtn",
home:"homeBtn",
priceText:"priceText",
pay:"payBtn",
legal:"legal",
courtesy:"courtesyBtn",
user:"adminUser",
password:"adminPass",
relaxationTitle:"relaxationTitle",
relaxationText:"relaxationText",
music:"musicBtn"
};
Object.keys(mapa).forEach(k=>{
const el=document.getElementById(mapa[k]);
if(!el)return;
if(el.tagName==="INPUT")el.placeholder=t(k);
else el.textContent=t(k);
});
}

function toggleAuthBox(){
const box=document.getElementById("authBox");
box.style.display=box.style.display==="block"?"none":"block";
}

async function realizarAccesoCortesia(){
const username=document.getElementById("adminUser").value.trim();
const password=document.getElementById("adminPass").value.trim();
const status=document.getElementById("authStatus");
status.textContent="";
try{
const r=await fetch("/api/v1/authorize-courtesy",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username,password,device_id:getDeviceId()})
});
const data=await r.json();
if(!r.ok)throw new Error(data.detail||t("accessError"));
status.textContent=t("adminActivated");
document.getElementById("adminPass").value="";
}catch(e){
status.textContent=e.message||t("accessError");
}
}

function limpiarTextoParaVoz(texto){
return String(texto||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
}

function separarParrafos(texto){
return limpiarTextoParaVoz(texto).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
}

function mostrarContenido(texto){
const output=document.getElementById("output");
output.innerHTML="";
const parrafos=separarParrafos(texto);
parrafos.forEach(p=>{
const el=document.createElement("p");
el.textContent=p;
output.appendChild(el);
});
output.style.display=parrafos.length?"block":"none";
}

function ocultarMusicaRelajacion(){
if(temporizadorMusica){
clearTimeout(temporizadorMusica);
temporizadorMusica=null;
}
detenerMusicaRelajacion();
document.getElementById("relaxation").style.display="none";
}

function detenerMusicaRelajacion(){
const frame=document.getElementById("relaxationFrame");
if(frame)frame.src="";
musicaActual="";
musicaActiva=false;
}

function prepararVideoRelajacion(){
const indice=Math.floor(Math.random()*RELAXATION_VIDEOS.length);
musicaActual=RELAXATION_VIDEOS[indice];
const frame=document.getElementById("relaxationFrame");
frame.src=musicaActual+"?rel=0&playsinline=1";
musicaActiva=false;
}

function mostrarMusicaRelajacion(){
if(vozActiva||vozCancelada||!ultimoTextoGenerado)return;
prepararVideoRelajacion();
document.getElementById("relaxationTitle").textContent=t("relaxationTitle");
document.getElementById("relaxationText").textContent=t("relaxationText");
document.getElementById("musicBtn").textContent=t("music");
document.getElementById("relaxation").style.display="block";
}

function activarMusicaRelajacion(){
if(!musicaActual)return;
const frame=document.getElementById("relaxationFrame");
if(musicaActiva){
frame.src=musicaActual+"?rel=0&playsinline=1";
musicaActiva=false;
return;
}
frame.src=musicaActual+"?autoplay=1&rel=0&playsinline=1";
musicaActiva=true;
}

async function obtenerContenido(isHook){
const status=document.getElementById("status");
const btn=isHook?document.getElementById("sampleBtn"):document.getElementById("fullBtn");
btn.disabled=true;
status.textContent="";
ocultarMusicaRelajacion();
window.speechSynthesis.cancel();
vozActiva=false;
vozCancelada=true;
try{
const r=await fetch("/api/v1/generate-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({device_id:getDeviceId(),language:idiomaActual,is_hook:!!isHook})
});
const data=await r.json();
if(!r.ok)throw new Error(data.detail||t("sessionError"));
ultimoTextoGenerado=limpiarTextoParaVoz(data.session_content||"");
mostrarContenido(ultimoTextoGenerado);
status.textContent=isHook?t("sampleReady"):t("sessionReady");
if(ultimoTextoGenerado)iniciarVozPorParrafos();
}catch(e){
status.textContent=e.message||t("sessionError");
}finally{
btn.disabled=false;
}
}

function seleccionarVoz(lang){
const voices=window.speechSynthesis.getVoices();
const pref=lang==="es"?["es-ES","es-US","es-MX","es"]:lang==="en"?["en-US","en-GB","en"]:["pt-BR","pt-PT","pt"];
for(const p of pref){
const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(p.toLowerCase()));
if(v)return v;
}
return voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang))||null;
}

function hablarSiguienteParrafo(){
if(!vozActiva||vozCancelada)return;
if(indiceVoz>=parrafosVoz.length){
vozActiva=false;
if(ultimoTextoGenerado&&!vozCancelada){
temporizadorMusica=setTimeout(()=>{
temporizadorMusica=null;
mostrarMusicaRelajacion();
},ESPERA_ENTRE_PARRAFOS);
}
return;
}
const texto=parrafosVoz[indiceVoz++];
const u=new SpeechSynthesisUtterance(texto);
u.lang=idiomaActual==="es"?"es-ES":idiomaActual==="en"?"en-US":"pt-BR";
const voz=seleccionarVoz(idiomaActual);
if(voz)u.voice=voz;
u.rate=.92;
u.pitch=1;
u.volume=1;
u.onend=()=>{
if(!vozActiva||vozCancelada)return;
setTimeout(hablarSiguienteParrafo,ESPERA_ENTRE_PARRAFOS);
};
u.onerror=()=>{
if(!vozActiva||vozCancelada)return;
setTimeout(hablarSiguienteParrafo,ESPERA_ENTRE_PARRAFOS);
};
window.speechSynthesis.speak(u);
}

function iniciarVozPorParrafos(){
if(!ultimoTextoGenerado)return;
ocultarMusicaRelajacion();
window.speechSynthesis.cancel();
vozCancelada=false;
parrafosVoz=separarParrafos(ultimoTextoGenerado);
indiceVoz=0;
vozActiva=true;
hablarSiguienteParrafo();
}

function reproducirVozHumana(){
if(!ultimoTextoGenerado){
document.getElementById("status").textContent=t("noContent");
return;
}
ocultarMusicaRelajacion();
if(window.speechSynthesis.speaking||vozActiva){
window.speechSynthesis.cancel();
vozActiva=false;
vozCancelada=true;
return;
}
iniciarVozPorParrafos();
}

function limpiarPantallaSesion(){
if(temporizadorMusica){
clearTimeout(temporizadorMusica);
temporizadorMusica=null;
}
detenerMusicaRelajacion();
document.getElementById("relaxation").style.display="none";
window.speechSynthesis.cancel();
vozActiva=false;
vozCancelada=true;
parrafosVoz=[];
indiceVoz=0;
ultimoTextoGenerado="";
document.getElementById("output").innerHTML="";
document.getElementById("output").style.display="none";
document.getElementById("status").textContent="";
document.getElementById("authStatus").textContent="";
document.getElementById("adminUser").value="";
document.getElementById("adminPass").value="";
document.getElementById("authBox").style.display="none";
}

function volverAlInicio(){
limpiarPantallaSesion();
document.getElementById("language").value=idiomaActual;
aplicarIdioma();
window.scrollTo({top:0,behavior:"smooth"});
document.getElementById("informationCard").scrollIntoView({behavior:"smooth",block:"start"});
}

async function iniciarPagoStripe(){
const status=document.getElementById("status");
const btn=document.getElementById("payBtn");
btn.disabled=true;
status.textContent=t("paymentPreparing");
try{
const r=await fetch("/api/v1/create-checkout-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({device_id:getDeviceId()})
});
const data=await r.json();
if(!r.ok)throw new Error(data.detail||t("accessError"));
if(!data.checkout_url)throw new Error(t("accessError"));
window.location.href=data.checkout_url;
}catch(e){
status.textContent=e.message||t("accessError");
btn.disabled=false;
}
}

async function comprobarRegresoDeStripe(){
const params=new URLSearchParams(window.location.search);
const sessionId=params.get("session_id");
const deviceId=params.get("device_id")||getDeviceId();
if(!sessionId)return;
const status=document.getElementById("status");
status.textContent=t("paymentReceived");
let intentos=0;
const revisar=async()=>{
try{
const r=await fetch("/api/v1/access-status?device_id="+encodeURIComponent(deviceId),{cache:"no-store"});
const data=await r.json();
if(data.authorized){
window.history.replaceState({},document.title,"/");
window.location.replace(BASE_URL);
return;
}
}catch(e){}
intentos++;
if(intentos<30){
setTimeout(revisar,1000);
}else{
status.textContent=t("paymentWait");
window.history.replaceState({},document.title,"/");
}
};
revisar();
}

window.speechSynthesis.onvoiceschanged=()=>{};

document.addEventListener("DOMContentLoaded",()=>{
getDeviceId();
cargarIdioma();
ocultarMusicaRelajacion();
comprobarRegresoDeStripe();
});
</script>
