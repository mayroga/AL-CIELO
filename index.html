<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL CIELO | May Roga LLC</title>
<meta name="description" content="AL CIELO de May Roga LLC. Un momento sencillo para respirar, descansar y continuar a tu propio ritmo.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
#app{width:100%;max-width:850px;margin:auto;padding:18px}
header{text-align:center;padding:8px 0 18px}
h1{font-size:clamp(34px,7vw,58px);margin:8px 0;font-weight:800}
h2{font-size:clamp(26px,5vw,40px);margin:10px 0}
h3{font-size:clamp(22px,4vw,30px);margin:8px 0}
p{font-size:clamp(20px,4vw,27px);line-height:1.55}
.small{font-size:17px;line-height:1.5}
.screen{display:none}
.screen.active{display:block}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 22px}
.langs button,.primary,.secondary,.danger{
border:2px solid #fff;background:#000;color:#fff;border-radius:12px;
padding:15px 20px;min-height:54px;font-weight:700
}
.langs button.active,.primary{background:#fff;color:#000}
.primary{width:100%;font-size:22px;margin:10px 0}
.secondary{width:100%;font-size:20px;margin:8px 0}
.danger{width:100%;font-size:19px;margin:8px 0}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{margin-top:22px}
.status{text-align:center;min-height:30px;font-size:18px;margin:12px 0}
.notice{font-size:18px;line-height:1.5;margin:14px 0}
#exerciseTitle{text-align:center}
#exerciseInstruction{
font-size:clamp(23px,4.8vw,32px);
line-height:1.65;
text-align:left;
margin:25px 0;
min-height:180px
}
#gap{
text-align:center;
font-size:20px;
font-weight:700;
min-height:32px;
margin:8px 0
}
#progress{
text-align:center;
font-size:18px;
margin:8px 0 18px
}
.hidden{display:none!important}
a{color:#fff}
input{
width:100%;
background:#000;color:#fff;border:2px solid #fff;border-radius:10px;
padding:16px;margin:7px 0;outline:none
}
footer{text-align:center;margin:35px 0 15px}
@media(max-width:500px){
#app{padding:12px}
.langs button{flex:1;min-width:90px}
}
</style>
</head>
<body>
<div id="app">

<header>
<h1>AL CIELO</h1>
<div class="langs">
<button id="langES" onclick="changeLanguage('es')">ESPAÑOL</button>
<button id="langEN" onclick="changeLanguage('en')">ENGLISH</button>
<button id="langPT" onclick="changeLanguage('pt')">PORTUGUÊS</button>
</div>
</header>

<section id="homeScreen" class="screen active">
<h2 id="homeTitle"></h2>
<p id="homeText"></p>
<div class="actions">
<button class="primary" id="startButton" onclick="startSession()"></button>
<button class="secondary" id="paymentButton" onclick="startPayment()"></button>
<button class="secondary" id="adminButton" onclick="showAdmin()"></button>
</div>
<p id="accessStatus" class="status"></p>
<p id="homeNotice" class="notice"></p>
</section>

<section id="adminScreen" class="screen">
<h2 id="adminTitle"></h2>
<p id="adminText"></p>
<input id="adminUser" autocomplete="username">
<input id="adminPass" type="password" autocomplete="current-password">
<button class="primary" onclick="authorizeCourtesy()" id="adminLoginButton"></button>
<button class="secondary" onclick="showHome()" id="adminBackButton"></button>
<p id="adminStatus" class="status"></p>
</section>

<section id="sessionScreen" class="screen">
<div id="progress"></div>
<h2 id="sessionTitle"></h2>
<h3 id="exerciseTitle"></h3>
<p id="exerciseInstruction"></p>
<div id="gap"></div>
<div class="actions">
<button class="primary hidden" id="continueButton" onclick="nextExercise()"></button>
<button class="secondary hidden" id="repeatButton" onclick="repeatExercise()"></button>
<button class="secondary" id="stopButton" onclick="stopAndGoHome()"></button>
</div>
</section>

<footer>
<p class="small">May Roga LLC</p>
<p class="small" id="legal"></p>
</footer>

</div>

<script>
const API_BASE="";
const BASE_URL="https://al-cielo.onrender.com";
const DEVICE_KEY="al_cielo_device_id";
const LANGUAGE_KEY="al_cielo_language";

const TEXT={
es:{
homeTitle:"Un momento para ti",
homeText:"Siéntate, descansa o permanece acostado cómodamente. Cuando estés listo, comienza.",
start:"COMENZAR",
payment:"OBTENER ACCESO",
admin:"ACCESO ADMINISTRATIVO",
back:"VOLVER",
login:"ENTRAR",
stop:"SALIR",
continue:"CONTINUAR",
repeat:"VOLVER A ESCUCHAR",
adminTitle:"Acceso administrativo",
adminText:"Introduce los datos de acceso.",
user:"Usuario",
pass:"Contraseña",
checking:"Comprobando acceso...",
authorized:"Acceso disponible.",
required:"Se requiere acceso para comenzar.",
paymentStarting:"Abriendo el acceso...",
paymentError:"No se pudo abrir el pago. Inténtalo nuevamente.",
adminSuccess:"Acceso autorizado.",
adminError:"Los datos no son correctos.",
loading:"Preparando tu sesión...",
error:"No se pudo preparar la sesión. Inténtalo nuevamente.",
speech:"Preparando la lectura...",
gap:"Espera ",
seconds:" segundos",
legal:"AL CIELO no sustituye servicios profesionales. Su contenido es una experiencia general de descanso y bienestar."
},
en:{
homeTitle:"A moment for you",
homeText:"Sit, rest, or remain comfortably lying down. When you are ready, begin.",
start:"START",
payment:"GET ACCESS",
admin:"ADMIN ACCESS",
back:"BACK",
login:"SIGN IN",
stop:"EXIT",
continue:"CONTINUE",
repeat:"LISTEN AGAIN",
adminTitle:"Administrative access",
adminText:"Enter the access information.",
user:"Username",
pass:"Password",
checking:"Checking access...",
authorized:"Access available.",
required:"Access is required to begin.",
paymentStarting:"Opening access...",
paymentError:"The payment page could not be opened. Please try again.",
adminSuccess:"Access authorized.",
adminError:"The information is not correct.",
loading:"Preparing your session...",
error:"The session could not be prepared. Please try again.",
speech:"Preparing the reading...",
gap:"Wait ",
seconds:" seconds",
legal:"AL CIELO does not replace professional services. Its content is a general rest and wellness experience."
},
pt:{
homeTitle:"Um momento para você",
homeText:"Sente-se, descanse ou permaneça deitado confortavelmente. Quando estiver pronto, comece.",
start:"COMEÇAR",
payment:"OBTER ACESSO",
admin:"ACESSO ADMINISTRATIVO",
back:"VOLTAR",
login:"ENTRAR",
stop:"SAIR",
continue:"CONTINUAR",
repeat:"OUVIR NOVAMENTE",
adminTitle:"Acesso administrativo",
adminText:"Digite os dados de acesso.",
user:"Usuário",
pass:"Senha",
checking:"Verificando acesso...",
authorized:"Acesso disponível.",
required:"É necessário ter acesso para começar.",
paymentStarting:"Abrindo o acesso...",
paymentError:"Não foi possível abrir o pagamento. Tente novamente.",
adminSuccess:"Acesso autorizado.",
adminError:"Os dados não estão corretos.",
loading:"Preparando sua sessão...",
error:"Não foi possível preparar a sessão. Tente novamente.",
speech:"Preparando a leitura...",
gap:"Aguarde ",
seconds:" segundos",
legal:"AL CIELO não substitui serviços profissionais. Seu conteúdo é uma experiência geral de descanso e bem-estar."
}
};

let language=localStorage.getItem(LANGUAGE_KEY)||"es";
let deviceId=localStorage.getItem(DEVICE_KEY);
let authorized=false;
let session=null;
let exerciseIndex=0;
let speaking=false;
let gapTimer=null;
let speechToken=0;
let voicesLoaded=false;

function makeDeviceId(){
return "alcielo_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,12);
}

if(!deviceId){
deviceId=makeDeviceId();
localStorage.setItem(DEVICE_KEY,deviceId);
}

function T(key){
return TEXT[language][key]||TEXT.es[key]||key;
}

function el(id){
return document.getElementById(id);
}

function show(id){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
el(id).classList.add("active");
}

function updateLanguageButtons(){
["es","en","pt"].forEach(x=>{
const b=el("lang"+x.toUpperCase());
if(b)b.classList.toggle("active",x===language);
});
}

function applyLanguage(){
document.documentElement.lang=language;
updateLanguageButtons();

el("homeTitle").textContent=T("homeTitle");
el("homeText").textContent=T("homeText");
el("startButton").textContent=T("start");
el("paymentButton").textContent=T("payment");
el("adminButton").textContent=T("admin");
el("homeNotice").textContent=T("legal");

el("adminTitle").textContent=T("adminTitle");
el("adminText").textContent=T("adminText");
el("adminUser").placeholder=T("user");
el("adminPass").placeholder=T("pass");
el("adminLoginButton").textContent=T("login");
el("adminBackButton").textContent=T("back");

el("continueButton").textContent=T("continue");
el("repeatButton").textContent=T("repeat");
el("stopButton").textContent=T("stop");
el("legal").textContent=T("legal");
}

function changeLanguage(newLanguage){
if(!TEXT[newLanguage])return;

stopSpeech();
clearGap();

language=newLanguage;
localStorage.setItem(LANGUAGE_KEY,language);

session=null;
exerciseIndex=0;

applyLanguage();
show("homeScreen");
checkAccess();
}

function clearGap(){
if(gapTimer){
clearInterval(gapTimer);
gapTimer=null;
}
el("gap").textContent="";
}

function stopSpeech(){
speechToken++;
speaking=false;

try{
window.speechSynthesis.cancel();
}catch(e){}

clearGap();

if(el("continueButton")){
el("continueButton").classList.add("hidden");
}

if(el("repeatButton")){
el("repeatButton").classList.add("hidden");
}
}

function loadVoices(){
try{
window.speechSynthesis.getVoices();
voicesLoaded=true;
}catch(e){}
}

if("speechSynthesis" in window){
window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();
}

function voiceForLanguage(lang){
const voices=window.speechSynthesis.getVoices();

const wanted={
es:["es-ES","es-MX","es-US"],
en:["en-US","en-GB"],
pt:["pt-BR","pt-PT"]
}[lang]||[];

for(const code of wanted){
const exact=voices.find(v=>v.lang===code);
if(exact)return exact;
}

for(const code of wanted){
const partial=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(code.slice(0,2).toLowerCase()));
if(partial)return partial;
}

return null;
}

function startGap(token){
if(token!==speechToken)return;

clearGap();

let remaining=6;
el("gap").textContent=T("gap")+remaining+T("seconds");

gapTimer=setInterval(()=>{
if(token!==speechToken){
clearGap();
return;
}

remaining--;

if(remaining<=0){
clearGap();
speaking=false;

el("continueButton").classList.remove("hidden");
el("repeatButton").classList.remove("hidden");
return;
}

el("gap").textContent=T("gap")+remaining+T("seconds");
},1000);
}

function speakInstruction(text){
stopSpeech();

if(!text){
el("continueButton").classList.remove("hidden");
return;
}

if(!("speechSynthesis" in window)){
speaking=false;
startGap(speechToken);
return;
}

const token=speechToken;
const utterance=new SpeechSynthesisUtterance(text);
const voice=voiceForLanguage(language);

if(voice){
utterance.voice=voice;
utterance.lang=voice.lang;
}else{
utterance.lang={
es:"es-ES",
en:"en-US",
pt:"pt-BR"
}[language];
}

utterance.rate=0.92;
utterance.pitch=1;
utterance.volume=1;

speaking=true;

utterance.onstart=()=>{
if(token!==speechToken)return;
speaking=true;
};

utterance.onend=()=>{
if(token!==speechToken)return;

speaking=false;

el("gap").textContent="";
startGap(token);
};

utterance.onerror=()=>{
if(token!==speechToken)return;

speaking=false;

startGap(token);
};

try{
window.speechSynthesis.speak(utterance);
}catch(e){
speaking=false;
startGap(token);
}
}

function renderExercise(){
if(!session||!session.exercises||!session.exercises.length)return;

stopSpeech();

const item=session.exercises[exerciseIndex];

el("sessionTitle").textContent=session.title||"AL CIELO";
el("exerciseTitle").textContent=item.title||("Parte "+(exerciseIndex+1));
el("exerciseInstruction").textContent=item.instruction||"";

el("progress").textContent=
(exerciseIndex+1)+" / "+session.exercises.length;

el("continueButton").classList.add("hidden");
el("repeatButton").classList.add("hidden");
el("gap").textContent=T("speech");

setTimeout(()=>{
if(session&&exerciseIndex<session.exercises.length){
speakInstruction(item.instruction||"");
}
},250);
}

function nextExercise(){
if(speaking)return;

if(!session)return;

if(exerciseIndex>=session.exercises.length-1){
stopSpeech();
show("homeScreen");
session=null;
exerciseIndex=0;
checkAccess();
return;
}

exerciseIndex++;
renderExercise();
}

function repeatExercise(){
if(!session)return;
renderExercise();
}

function stopAndGoHome(){
stopSpeech();
session=null;
exerciseIndex=0;
show("homeScreen");
checkAccess();
}

async function checkAccess(){
el("accessStatus").textContent=T("checking");

try{
const r=await fetch(
API_BASE+"/api/v1/access-status?device_id="+encodeURIComponent(deviceId),
{cache:"no-store"}
);

const data=await r.json();
authorized=!!data.authorized;

el("accessStatus").textContent=
authorized?T("authorized"):T("required");

el("startButton").disabled=!authorized;
}catch(e){
authorized=false;
el("accessStatus").textContent=T("required");
el("startButton").disabled=true;
}
}

async function startSession(){
if(!authorized){
el("accessStatus").textContent=T("required");
return;
}

stopSpeech();
clearGap();

el("accessStatus").textContent=T("loading");

try{
const r=await fetch(API_BASE+"/api/v1/generate-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
device_id:deviceId,
language:language,
is_hook:false
})
});

const data=await r.json();

if(!r.ok||!data.session){
throw new Error(data.message||"session");
}

session=data.session;

if(!session.exercises||!session.exercises.length){
throw new Error("empty");
}

exerciseIndex=0;
show("sessionScreen");
renderExercise();

}catch(e){
el("accessStatus").textContent=T("error");
}
}

async function startPayment(){
el("accessStatus").textContent=T("paymentStarting");

try{
const r=await fetch(API_BASE+"/api/v1/create-checkout-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
device_id:deviceId
})
});

const data=await r.json();

if(!r.ok||!data.checkout_url){
throw new Error(data.message||"stripe");
}

window.location.href=data.checkout_url;

}catch(e){
el("accessStatus").textContent=T("paymentError");
}
}

function showAdmin(){
stopSpeech();
clearGap();
show("adminScreen");
el("adminStatus").textContent="";
el("adminUser").focus();
}

function showHome(){
stopSpeech();
clearGap();
show("homeScreen");
}

async function authorizeCourtesy(){
const username=el("adminUser").value.trim();
const password=el("adminPass").value;

el("adminStatus").textContent=T("checking");

try{
const r=await fetch(API_BASE+"/api/v1/authorize-courtesy",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,
password,
device_id:deviceId
})
});

const data=await r.json();

if(!r.ok||!data.authorized){
throw new Error(data.message||"login");
}

authorized=true;
el("adminStatus").textContent=T("adminSuccess");

setTimeout(()=>{
show("homeScreen");
checkAccess();
},500);

}catch(e){
el("adminStatus").textContent=T("adminError");
}
}

function handleStripeReturn(){
const params=new URLSearchParams(window.location.search);
const sid=params.get("session_id");
const did=params.get("device_id");

if(did){
deviceId=did;
localStorage.setItem(DEVICE_KEY,deviceId);
}

if(sid){
window.history.replaceState({},document.title,"/");
}
}

applyLanguage();
handleStripeReturn();
checkAccess();
</script>
</body>
</html>
